name: Android

# Pushes to main build an APK only when the Android app or what it packs changed. v* tags are Android releases;
# the desktop app's are desktop-v* (linux.yml), which v* doesn't match.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'shared/**'
      - 'third_party/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # third_party/llama.cpp, for the offline translation model
          fetch-depth: 0 # tags, for the release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Sign with the same debug key as local builds, so CI APKs install over the existing app
      # without an uninstall (which would wipe settings and the WRITE_SECURE_SETTINGS grant).
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is not set (see AGENTS.md)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: ./gradlew assembleDebug

      - name: Name APK after version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "ocrclip-$version.apk"
          echo "APK=ocrclip-$version.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes from the previous Android release, not from a desktop one in between.
        run: |
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Android $GITHUB_REF_NAME" --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
